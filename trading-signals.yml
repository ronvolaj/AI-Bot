# Put this file in your GitHub repository at:  .github/workflows/trading-signals.yml
# It runs the bot every weekday morning and sends the signals to your Telegram.

name: Trading signals

on:
  schedule:
    - cron: "37 6 * * 1-5"     # 06:37 UTC = 07:37 in Albania (winter time), Mon-Fri
  workflow_dispatch:            # adds a "Run workflow" button so you can run it any time

permissions:
  contents: write               # lets it save signals_log.csv back to the repository

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install yfinance pandas vaderSentiment anthropic requests alpaca-py

      - name: Scan news and send signals
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python news_trading_bot.py

      - name: Weekly report card (Fridays)
        if: github.event.schedule && hashFiles('signals_log.csv') != ''
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "$(date +%u)" = "5" ]; then python news_trading_bot.py check; fi

      - name: Save signal history
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add signals_log.csv
          git commit -m "Log signals $(date +%F)" || echo "Nothing to save"
          git push
